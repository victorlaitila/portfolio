<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Software Project Portfolio | Victor Laitila</title>
    <meta name="description" content="Portfolio website of a passionate software engineer specializing in full-stack development, modern web technologies, and creating exceptional digital experiences." />
    <meta name="author" content="Victor Laitila" />

    <!-- The SITE_URL placeholders are filled in from career.yaml at build time (see vite.config.ts). -->
    <link rel="canonical" href="%SITE_URL%" />

    <!-- Link previews (LinkedIn, Slack, X, ...). Regenerate the image with `npm run generate:og-image`. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:title" content="Software Project Portfolio | Victor Laitila" />
    <meta property="og:description" content="Portfolio showcasing projects, skills, and experience in software engineering and web development." />
    <meta property="og:image" content="%SITE_URL%og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Victor Laitila, Software Engineer - portfolio" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=block" rel="stylesheet">
    <link rel="icon" href="/favicon.png" type="image/png" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
