name: Link check

# Checks that the external links in career.yaml (GitHub, LinkedIn, project demos and videos) still respond.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  pull_request:
    paths: [src/data/career.yaml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: lycheeverse/lychee-action@v2
        with:
          # LinkedIn answers bots with 999; 429 means rate-limited, not broken.
          args: --no-progress --max-retries 3 --accept 200,429,999 src/data/career.yaml
          fail: true
