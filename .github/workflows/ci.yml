name: CI

# Checks only. Deploying is a separate, manual step: see deploy.yml, which reuses this workflow.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      upload-pages:
        description: Upload the build as the GitHub Pages artifact for deploy.yml
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # A separate group for deploy.yml's check run, so it never cancels or queues behind a push's run.
  group: ci-${{ github.ref }}${{ inputs.upload-pages && '-deploy' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    name: Lint, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}
          VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      - uses: actions/upload-pages-artifact@v4
        if: inputs.upload-pages
        with:
          path: dist

  cv:
    name: CV up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cv-generator/requirements-dev.txt
      - run: pip install -r cv-generator/requirements-dev.txt
      - run: python -m pytest
