projects:
  - name: AI Article Summarizer
    description: A full-stack web application that extracts and summarizes content from URLs, uploaded files, and free text using a BART transformer model (facebook/bart-large-cnn) through the Hugging Face Inference API. Users can generate summaries in multiple modes, extract keywords automatically, save summaries to a personal library, access text-to-speech playback, and easily copy, download, or share results. A rate-limited FastAPI backend combines web scraping and PDF extraction with the model to deliver concise, non-destructive summaries, helping readers quickly grasp article content without losing important context.
    cv_summary: React/TypeScript and Python (FastAPI) app that summarizes URLs, PDFs and text with a Hugging Face transformer model, backed by PostgreSQL, Docker and Sentry monitoring.
    url: https://github.com/victorlaitila/ai-article-summarizer
    image: article-summarizer-thumbnail.webp
    tags:
      - React
      - TypeScript
      - Tailwind CSS
      - Python (FastAPI)
      - Docker
      - PostgreSQL
      - Vitest
      - GitHub Actions
      - Sentry (Monitoring)
    demo: https://victorlaitila.github.io/ai-article-summarizer/
    video: https://www.youtube.com/watch?v=lZrHd0tOBXo

  - name: Dependency Risk Scanner
    url: https://github.com/victorlaitila/dependency-risk-scanner
    demo: https://victorlaitila.github.io/dependency-risk-scanner/
    description: A full-stack web application that helps developers understand the security and structural risks within their project dependencies. Users upload lockfiles to visualize dependency relationships, identify high-impact packages, and assess known vulnerability exposure from the OSV.dev API. The app combines graph-based impact analysis with LLM-generated explanations (Hugging Face chat completions, with fallback handling) to provide both technical data and concise reasoning for dependency-risk decisions.
    cv_summary: React/TypeScript and Node.js (Fastify) app that builds dependency graphs from lockfiles, scores package impact, adds OSV vulnerability data and explains risks with an LLM.
    image: dependency-risk-scanner-thumbnail.webp
    badge: Beta
    tags:
      - React
      - TypeScript
      - Tailwind CSS
      - Node.js (Fastify)
      - Redis (Upstash)
      - Vitest
      - GitHub Actions

  - name: SoundAtlas
    description: A web application that lets users explore the world through music, playing a curated soundtrack preview for whichever country they click on an interactive map. Each click reveals a track chosen to capture that country's musical character, giving users a fast, playful way to browse the globe by sound. The app draws from a curated dataset sourced from iTunes to ensure every country plays a consistent, high-quality track instead of a random or irrelevant result.
    url: https://github.com/victorlaitila/sound-atlas
    targets: [portfolio]
    image: sound-atlas-thumbnail.webp
    tags:
      - React
      - TypeScript
      - Tailwind CSS
      - Next.js
      - MapLibre GL
      - AWS (Lambda, DynamoDB)
      - Vitest
      - GitHub Actions
    video: https://www.youtube.com/watch?v=YKBDeGWDreQ

